<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Cats | Gean Paulo</title>

  <!-- Theme: dark default, follows the choice saved on the links page -->
  <meta name="theme-color" content="#0e0e10">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Meet Curiosity and Ming Ming, the cats behind links.geanpaulo.com.">

  <link rel="icon" href="assets/images/gp5.svg" type="image/svg+xml">

  <!-- Fonts + icons, same system as the links page -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">

  <style>
    :root {
      --bg: #0e0e10;
      --fg: #f2f1ec;
      --muted: #9b9a93;
      --card: #16161a;
      --border: rgba(242, 241, 236, 0.16);
      --accent: #cdf553;
      --accent-ink: #131311;
      --accent-text: #cdf553;
    }

    body.light {
      --bg: #f2f1ec;
      --fg: #131311;
      --muted: #6e6d66;
      --card: #ffffff;
      --border: rgba(19, 19, 17, 0.15);
      --accent: #cdf553;
      --accent-ink: #131311;
      --accent-text: #4d7c0f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      color-scheme: dark;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 2.5rem 1.25rem;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body.light {
      color-scheme: light;
    }

    ::selection {
      background: var(--accent);
      color: var(--accent-ink);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .label {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--muted);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .label .ph {
      color: var(--accent-text);
      font-size: 1.05rem;
    }

    h1 {
      font-family: 'Archivo', sans-serif;
      font-weight: 800;
      font-stretch: 108%;
      font-size: clamp(1.9rem, 6vw, 2.6rem);
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin-bottom: 1.75rem;
      text-align: center;
    }

    .cat-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
    }

    .cat-media img {
      width: 100%;
      display: block;
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }

    .cat-body {
      padding: 1.4rem 1.5rem 0.25rem;
      text-align: center;
    }

    .cat-name {
      font-family: 'Archivo', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: -0.01em;
      margin-bottom: 0.45rem;
    }

    .cat-desc {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--muted);
    }

    .cat-actions {
      padding: 1.4rem 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .cat-actions a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.95rem 1rem;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cat-actions a:hover {
      transform: translateY(-2px);
    }

    .cat-actions a:active {
      transform: translateY(0) scale(0.99);
    }

    .cat-actions svg {
      height: 1.2rem;
      width: auto;
      display: block;
    }

    .brand-icon {
      display: grid;
      place-items: center;
    }

    /* Brand solids, no gradients */
    .donate-paypal {
      background: #0070BA;
      color: #fff;
    }

    .donate-wise {
      background: #9FE870;
      color: #163300;
    }

    .back {
      margin-top: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.6rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      color: var(--fg);
      box-shadow: inset 0 0 0 1px var(--border);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .back:hover {
      transform: scale(1.03);
    }

    @media (prefers-reduced-motion: reduce) {
      .cat-actions a,
      .back {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <!-- Follow the theme chosen on the links page -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var light = saved ? saved === 'light' : !window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (light) {
        document.body.classList.add('light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#f2f1ec');
      }
    })();
  </script>

  <p class="label"><i class="ph ph-paw-print" aria-hidden="true"></i> Friends of the site</p>
  <h1>Meet Our Beloved Cats &#128049;</h1>

  <div class="cat-card">
    <div class="cat-media">
      <img src="assets/images/curiosity.jpg" alt="Curiosity and Ming Ming">
    </div>

    <div class="cat-body">
      <div class="cat-name">Curiosity &amp; Ming Ming</div>
      <p class="cat-desc">Help us feed our beloved cats! Any support is appreciated &#10084;&#65039;</p>
    </div>

    <div class="cat-actions">
      <a href="https://www.paypal.me/geanpaulo" target="_blank" rel="noopener" class="donate-paypal">
        <span class="brand-icon" data-icon="paypal"></span>
        Donate via PayPal
      </a>
      <a href="https://wise.com/pay/me/geanpaulop" target="_blank" rel="noopener" class="donate-wise">
        <span class="brand-icon" data-icon="wise"></span>
        Donate via Wise
      </a>
    </div>
  </div>

  <a class="back" href="/"><i class="ph ph-arrow-left" aria-hidden="true"></i> Back to links</a>

  <script>
    // Inline the brand marks so they inherit the button colors.
    document.querySelectorAll('.brand-icon').forEach((slot) => {
      const name = slot.dataset.icon;
      fetch(`assets/icons/${name}.svg`)
        .then((r) => r.text())
        .then((svg) => {
          if (!/<svg[^>]*fill=/.test(svg)) {
            svg = svg.replace(/<svg /, `<svg fill="${name === 'wise' ? '#163300' : '#fff'}" `);
          }
          slot.innerHTML = svg.replace(/<svg /, '<svg height="20" ');
        })
        .catch(() => slot.remove());
    });
  </script>
</body>
</html>
