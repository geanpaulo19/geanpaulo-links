<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gean Paulo | Links</title>

  <!-- Theme: dark default, light available via toggle; JS updates theme-color -->
  <meta name="theme-color" content="#0e0e10">

  <!-- Sitemap -->
  <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml">

  <!-- Basic SEO -->
  <meta name="description" content="All of Gean Paulo's links in one place: portfolio, socials, projects, and the best ways to get in touch.">
  <meta name="author" content="Gean Paulo">
  <meta name="keywords" content="Gean Paulo, links, social links, portfolio, web developer, designer, projects">
  <link rel="canonical" href="https://links.geanpaulo.com/">

  <!-- Open Graph / Facebook -->
  <meta property="og:title" content="Gean Paulo | Links">
  <meta property="og:description" content="All of Gean Paulo's links in one place: portfolio, socials, projects, and the best ways to get in touch.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://links.geanpaulo.com/">
  <meta property="og:image" content="https://links.geanpaulo.com/assets/images/geanopengraph2.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Gean Paulo | Links">
  <meta name="twitter:description" content="All of Gean Paulo's links in one place: portfolio, socials, projects, and the best ways to get in touch.">
  <meta name="twitter:image" content="https://links.geanpaulo.com/assets/images/geanopengraph2.png">

  <!-- Favicon -->
  <link rel="icon" href="assets/images/gp5.svg" type="image/svg+xml">

  <!-- Fonts: Archivo variable (display) + Inter (body) + JetBrains Mono (labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Icons: Phosphor (greeting, weather, arrows) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Gean Paulo",
    "url": "https://geanpaulo.com/",
    "image": "https://links.geanpaulo.com/assets/images/geanopengraph2.png",
    "jobTitle": "Web Designer & Front-End Developer",
    "description": "Web designer and front-end developer crafting interactive, user-friendly digital experiences.",
    "sameAs": [
      "https://geanpaulo.com",
      "https://facebook.com/geanpaulofrancois",
      "https://instagram.com/geanpau.lo",
      "https://www.threads.net/@geanpau.lo",
      "https://github.com/geanpaulo19",
      "https://linkedin.com/in/gean-paulo-paguirigan-b391182aa",
      "https://x.com/geanpaulo_"
    ]
  }
  </script>
</head>
<body>

  <!-- Apply saved theme before first paint to avoid a flash -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var light = saved ? saved === 'light' : !window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (light) document.body.classList.add('light');
    })();
  </script>

  <!-- Theme toggle -->
  <button id="theme-toggle" aria-label="Toggle dark and light mode">
    <i class="ph ph-sun" aria-hidden="true"></i>
  </button>

  <!-- Floating wordmark chip, sticky while scrolling -->
  <a class="cover-chip rise" style="--d: 0.5s" href="https://geanpaulo.com" aria-label="Gean Paulo, visit the portfolio">
    <span class="chip-name">Gean Paulo<sup>&reg;</sup></span>
    <span class="chip-sep" aria-hidden="true"></span>
    <span class="chip-tag">Links</span>
  </a>

  <!-- Cover photo, melting into the page with a gradient -->
  <header class="cover">
    <img class="cover-img" src="assets/images/cover.jpg" alt="">
  </header>

  <!-- Page content -->
  <main class="page">

    <!-- Identity -->
    <section class="identity" aria-label="About Gean Paulo">
      <img class="avatar rise" style="--d: 0.1s" src="assets/images/avatar.jpg" alt="Gean Paulo" width="96" height="96">
      <div class="identity-copy">
        <p class="greeting rise" style="--d: 0.05s">
          <i class="ph ph-hand-waving" aria-hidden="true"></i>
          <span id="greeting-text">Hello</span>
        </p>
        <h1 class="name rise" style="--d: 0.15s">Gean Paulo</h1>
        <p class="bio rise" style="--d: 0.2s">Web designer &amp; front-end developer crafting interactive, user-friendly digital experiences.</p>
        <p class="status rise" style="--d: 0.3s">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="availability">Available for projects</span>
          <span class="sep" aria-hidden="true">|</span>
          <span class="tabular" id="mnl-time">--:--</span> <span>MNL</span>
          <span class="sep weather-sep" aria-hidden="true" hidden>|</span>
          <span id="weather" hidden><i class="ph" id="weather-icon" aria-hidden="true"></i> <span id="weather-text"></span></span>
        </p>
        <div class="share-row rise" style="--d: 0.4s">
          <button class="share-btn" id="share-btn" type="button">
            <i class="ph ph-share-network" aria-hidden="true"></i>
            Share this page
          </button>
        </div>
      </div>
    </section>

    <!-- Featured project (populated by app.js) -->
    <section id="featured" class="featured" aria-label="Featured project"></section>

    <!-- Links (populated by app.js) -->
    <nav id="links" class="links" aria-label="All links"></nav>
  </main>

  <!-- Footer -->
  <footer class="page footer reveal">
    <a class="cat-link" href="cat.html" aria-label="Meet the cats">
      <img src="assets/images/orangecat.png" alt="" width="64" height="64">
    </a>
    <p class="copyright">&copy; 2026 &middot; Purr-fectly crafted in Manila &#128062;</p>
  </footer>

  <!-- JavaScript -->
  <script src="app.js"></script>
</body>
</html>
