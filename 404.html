<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Gean Paulo</title>

  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="The page you are looking for could not be found. Return to links.geanpaulo.com to find Gean Paulo's socials, projects, and portfolio." />
  <link rel="canonical" href="https://links.geanpaulo.com/" />

  <meta name="theme-color" content="#0e0e10">

  <link rel="icon" type="image/svg+xml" href="assets/images/gp5.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0e0e10;
      --fg: #f2f1ec;
      --muted: #9b9a93;
      --border: rgba(242, 241, 236, 0.16);
      --accent: #cdf553;
      --accent-ink: #131311;
      --accent-text: #cdf553;
    }

    body.light {
      --bg: #f2f1ec;
      --fg: #131311;
      --muted: #6e6d66;
      --border: rgba(19, 19, 17, 0.15);
      --accent: #cdf553;
      --accent-ink: #131311;
      --accent-text: #4d7c0f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      color-scheme: dark;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body.light {
      color-scheme: light;
    }

    ::selection {
      background: var(--accent);
      color: var(--accent-ink);
    }

    .progress-line {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent);
    }

    .wordmark-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.5rem;
    }

    .wordmark-bar a {
      font-family: 'Archivo', sans-serif;
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: -0.01em;
      color: var(--fg);
      text-decoration: none;
    }

    .wordmark-bar sup {
      font-size: 0.6rem;
    }

    .wordmark-bar span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 5rem 1.5rem 3rem;
    }

    h1 {
      font-family: 'Archivo', sans-serif;
      font-weight: 800;
      font-stretch: 112%;
      font-size: clamp(7rem, 22vw, 17rem);
      line-height: 0.85;
      letter-spacing: -0.03em;
    }

    h1 em {
      font-style: normal;
      color: var(--muted);
    }

    .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 2.2rem 0 0;
    }

    p.desc {
      color: var(--muted);
      max-width: 420px;
      line-height: 1.7;
      margin: 1.4rem auto 0;
      font-size: 0.95rem;
    }

    .actions {
      margin-top: 2.6rem;
      display: flex;
      gap: 0.9rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      padding: 1rem 2.2rem;
      border-radius: 999px;
      background: var(--fg);
      color: var(--bg);
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    a.button:hover {
      transform: scale(1.03);
    }

    a.ghost {
      background: transparent;
      color: var(--fg);
      box-shadow: inset 0 0 0 1px rgba(242, 241, 236, 0.16);
    }

    footer {
      border-top: 1px solid var(--border);
      width: 100%;
      padding: 1.4rem 1.5rem 1.3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .copyright,
    .meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
    }

    .meta .tabular {
      font-variant-numeric: tabular-nums;
    }

    .meta .sep {
      opacity: 0.4;
      padding: 0 0.5rem;
    }

    @media (max-width: 640px) {
      main {
        padding: 4rem 1.25rem 2.5rem;
      }

      footer {
        flex-direction: column;
        gap: 0.6rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      a.button {
        transition: none;
      }
    }
  </style>
</head>
<body>

  <!-- Follow the theme chosen on the links page -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var light = saved ? saved === 'light' : !window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (light) {
        document.body.classList.add('light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#f2f1ec');
      }
    })();
  </script>

  <div class="progress-line" aria-hidden="true"></div>

  <div class="wordmark-bar">
    <a href="https://links.geanpaulo.com">Gean Paulo<sup>&reg;</sup></a>
    <span>Dead link</span>
  </div>

  <main>
    <h1 aria-label="404">4<em>0</em>4</h1>
    <p class="label">Page not found</p>
    <p class="desc">
      The link you followed doesn't exist, was moved, or never landed here in the first place.
      The links page has everything that does.
    </p>
    <div class="actions">
      <a class="button" href="/">Back to Links</a>
      <a class="button ghost" href="https://geanpaulo.com">Visit Portfolio</a>
    </div>
  </main>

  <footer>
    <p class="copyright">&copy; 2026 Gean Paulo</p>
    <p class="meta">
      <span class="tabular" id="mnl-time">--:--</span> MNL<span class="sep">&middot;</span><span class="tabular" id="viewport">-- &times; --</span>
    </p>
  </footer>

  <script>
    // Live Manila clock
    function tickClock() {
      document.getElementById('mnl-time').textContent = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Asia/Manila',
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      }).format(new Date());
    }
    tickClock();
    setInterval(tickClock, 30000);

    // Live viewport readout
    function tickViewport() {
      document.getElementById('viewport').textContent =
        window.innerWidth + ' \u00D7 ' + window.innerHeight;
    }
    tickViewport();
    window.addEventListener('resize', tickViewport);
  </script>
</body>
</html>
